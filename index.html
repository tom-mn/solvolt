<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVOLT - Logo Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="body">
<div class="relative">

    <!-- Section 1 -->
    <div class="section-01 sticky top-0 h-screen flex flex-col items-center justify-center" style="background: url('assets/bg.jpg') no-repeat; background-size: cover; background-position: center;">
        <img src="assets/1.png" alt="Logo concept 1" style="max-width: 400px; outline: 1px soild red">
        <p class="mt-2" style="color: #FFF;">Scroll Down for next slide</p>
    </div>

    <!-- Section 2 - Transition slide -->
    <div class="section-02 sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: url('assets/bg1.jpg') no-repeat; background-size: cover; background-position: center;">
    </div>

    <!-- Section 3 -->
    <div class="section-03 sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: url('assets/bg2.jpg') no-repeat; background-size: cover; background-position: center;">
        <img src="assets/2.png" alt="Logo concept 2" style="max-width: 400px;">
        <p class="mt-2">Scroll Down for next slide</p>
    </div>

    <!-- Section 4 - Transition slide -->
    <div class="section-04 sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: url('assets/shirt.jpg') no-repeat; background-size: cover; background-position: center;">
    </div>

    <!-- Section 5 -->
    <div class="section-05 sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: url('assets/bg3.jpg') no-repeat; background-size: cover; background-position: center;">
        <img src="assets/3.png" alt="Logo concept 3" style="max-width: 400px;">
        <p class="mt-2">Scroll Down for next slide</p>
    </div>

    <!-- Section 6 - Transition slide -->
    <div class="section-06 sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: url('assets/bg4.jpg') no-repeat; background-size: cover; background-position: center;">
    </div>

    <!-- Section 7 - Logo grid overview -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background-color: #0b1519;">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-20 place-items-center">
            <div class="flex flex-col items-center gap-2">
                <img src="assets/1.png" alt="Logo concept 1" class="sm:max-w-[200px] max-w-[100px]">
                <span style="color: #4f636b">10</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <img src="assets/2.png" alt="Logo concept 2" class="max-w-[300px]">
                <span style="color: #4f636b">2</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <img src="assets/3.png" alt="Logo concept 3" class="max-w-[300px]">
                <span style="color: #4f636b">3</span>
            </div>
        </div>

    </div>

</div>
</body>
</html>
